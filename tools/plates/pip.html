<!doctype html><html><head><meta charset="utf-8"><style>{{theme}}
.frame { position: absolute; left: 50%; width: {{frame_w}}px; border-radius: {{frame_radius}}px; overflow: hidden; box-shadow: var(--shadow); background: transparent; }
.frame.in { animation-name: pip-in; } .frame.out { animation-name: pip-out; }
@keyframes pip-in  { from { opacity: 0; transform: translate3d(-50%, 30px, 0) scale(.9); } to { opacity: 1; transform: translate3d(-50%, 0, 0) scale(1); } }
@keyframes pip-out { from { opacity: 1; transform: translate3d(-50%, 0, 0) scale(1); } to { opacity: 0; transform: translate3d(-50%, -10px, 0) scale(.96); } }
.frame.phone { border: 14px solid #15171c; border-radius: 54px; background: #000; }
/* cutout: a transparent PNG (mascot, product, illustration) floating with no frame, just a soft shadow under it */
.frame.cutout { background: transparent; box-shadow: none; border-radius: 0; overflow: visible; }
.frame.cutout img { filter: drop-shadow(0 18px 22px rgba(0,0,0,.35)); }
.bob { animation: none; } .bob.float { animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(1.2deg); } }
img { display: block; width: 100%; height: auto; transform-origin: {{origin}}; animation: kb var(--dur) linear both; }
@keyframes kb { from { transform: scale(1); } to { transform: scale({{zoom}}); } }
.cap { position: absolute; left: 50%; transform: translateX(-50%); margin-top: 18px; font-size: {{size}}px; font-weight: 700; padding: .3em .7em; border-radius: 18px; white-space: nowrap; }
/* stamp: a rotated red label slammed onto the screenshot ("OLD WAY", "WRONG") */
.stamp { position: absolute; left: 50%; top: {{stamp_top}}px; transform: translate(-50%, -50%) rotate(-10deg); font-size: calc({{size}}px * 2.1); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #e04545; border: .12em solid #e04545; border-radius: .18em; padding: .05em .35em; background: rgba(255,255,255,.08); animation: slam .28s cubic-bezier(.2,1.6,.4,1) both; animation-delay: .45s; }
@keyframes slam { from { opacity: 0; transform: translate(-50%, -50%) rotate(-10deg) scale(2.4); } to { opacity: 1; transform: translate(-50%, -50%) rotate(-10deg) scale(1); } }
/* highlight: a translucent accent band drawn across one line of the screenshot */
.hl { position: absolute; height: {{hl_h}}px; left: {{hl_x}}px; top: {{hl_y}}px; width: {{hl_w}}px; background: var(--accent); opacity: .42; border-radius: 6px; transform-origin: left; animation: hl .45s var(--ease-out) both; animation-delay: .4s; }
@keyframes hl { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style></head><body><div class="stage">
<div class="frame in out {{device}}" style="top: {{top}}px;"><div class="bob {{float}}"><img src="{{src}}"></div>{{hl_html}}</div>
{{stamp_html}}
{{caption_html}}
</div><script>{{harness}}</script></body></html>
