<!doctype html><html><head><meta charset="utf-8"><style>{{theme}}
.frame { position: absolute; left: 50%; width: {{frame_w}}px; border-radius: {{frame_radius}}px; overflow: hidden; box-shadow: var(--shadow); background: #000; }
.frame.in { animation-name: pip-in; } .frame.out { animation-name: pip-out; }
@keyframes pip-in  { from { opacity: 0; transform: translate3d(-50%, 30px, 0) scale(.9); } to { opacity: 1; transform: translate3d(-50%, 0, 0) scale(1); } }
@keyframes pip-out { from { opacity: 1; transform: translate3d(-50%, 0, 0) scale(1); } to { opacity: 0; transform: translate3d(-50%, -10px, 0) scale(.96); } }
.frame.phone { border: 14px solid #15171c; border-radius: 54px; }
img { display: block; width: 100%; height: auto; transform-origin: {{origin}}; animation: kb var(--dur) linear both; }
@keyframes kb { from { transform: scale(1); } to { transform: scale({{zoom}}); } }
.cap { position: absolute; left: 50%; transform: translateX(-50%); margin-top: 18px; font-size: {{size}}px; font-weight: 700; padding: .3em .7em; border-radius: 18px; white-space: nowrap; }
</style></head><body><div class="stage">
<div class="frame in out {{device}}" style="top: {{top}}px;"><img src="{{src}}"></div>
{{caption_html}}
</div><script>{{harness}}</script></body></html>
