<!doctype html><html><head><meta charset="utf-8"><style>{{theme}}
.stat { padding: .5em .9em .55em; text-align: center; min-width: 46%; }
.stat.in.center-x { animation-name: plate-in-x; } .stat.out.center-x { animation-name: plate-out-x; }
@keyframes plate-in-x  { from { opacity: 0; transform: translate3d(-50%, calc(var(--ty) + 24px), 0) scale(.92); } to { opacity: 1; transform: translate3d(-50%, var(--ty), 0) scale(1); } }
@keyframes plate-out-x { from { opacity: 1; transform: translate3d(-50%, var(--ty), 0) scale(1); } to { opacity: 0; transform: translate3d(-50%, calc(var(--ty) - 12px), 0) scale(.96); } }
.num { font-size: {{size}}px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.num .acc { color: var(--accent); }
.lbl { margin-top: .3em; font-size: calc({{size}}px * 0.3); font-weight: 700; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
.light .lbl { color: rgba(15,17,21,.6); }
.thumbs { display: flex; gap: .4em; justify-content: center; margin-top: .6em; }
.thumbs img { height: calc({{size}}px * 1.6); width: auto; border-radius: 14px; box-shadow: var(--shadow); animation: plate-in .4s var(--spring) both; }
</style></head><body><div class="stage">
<div class="card stat in out center-x {{variant}} {{pos}}" style="{{style}}"><div class="num"><span id="n">0</span></div><div class="lbl">{{label}}</div>{{thumbs_html}}</div>
</div><script>{{harness}}
(function(){
  var target = {{value}}, prefix = "{{prefix}}", suffix = "{{suffix}}", dur = 1.1, delay = 0.15;
  var el = document.getElementById('n');
  var fmt = new Intl.NumberFormat('en-US', {maximumFractionDigits: {{decimals}}});
  window.__tick = function (t) {
    var p = Math.min(1, Math.max(0, (t - delay) / dur));
    var e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = prefix + '<span class="acc">' + fmt.format(target * e) + '</span>' + suffix;
  };
  window.__tick(0);
})();
</script></body></html>
