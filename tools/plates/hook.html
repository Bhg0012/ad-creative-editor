<!doctype html><html><head><meta charset="utf-8"><style>{{theme}}
.hook { padding: .35em .6em .4em; font-size: {{size}}px; font-weight: 800; line-height: 1.12; letter-spacing: -0.015em; text-align: center; white-space: pre-wrap; animation: hook-in .01s linear both, plate-out .25s ease-in both; animation-delay: 0s, calc(var(--dur) - .25s); }
.hook.center-x { animation-name: hook-in, plate-out-x; }
@keyframes hook-in { from { opacity: 1; } to { opacity: 1; } }
@keyframes plate-out-x { from { opacity: 1; transform: translate3d(-50%, 0, 0); } to { opacity: 0; transform: translate3d(-50%, -12px, 0) scale(.96); } }
.hook em { font-style: normal; color: var(--accent); }
.hook.uc { text-transform: uppercase; letter-spacing: .01em; }
/* clean: no box, white type with a soft shadow straight on the footage, a small kicker above and a sub line below
   (reference 4: "Building a / Fake Money Manager / with Grok Bot"). */
.hook.clean { background: none; box-shadow: none; color: #fff; font-size: calc({{size}}px * 1.3); line-height: 1.08; padding: .2em .4em; text-shadow: 0 2px 3px rgba(0,0,0,.55), 0 0 22px rgba(0,0,0,.4); }
.hook .kicker { display: block; font-size: .58em; font-weight: 700; letter-spacing: 0; margin-bottom: .22em; opacity: .96; }
.hook .sub { display: block; font-size: .72em; font-weight: 700; margin-top: .22em; opacity: .96; }
</style></head><body><div class="stage">
<div class="card hook center-x pos-top {{variant}} {{uc}}">{{kicker_html}}{{text}}{{sub_html}}</div>
</div><script>{{harness}}</script></body></html>
