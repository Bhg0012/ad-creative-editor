<!doctype html><html><head><meta charset="utf-8"><style>{{theme}}
/* a small white notice card: one line of plain text with an optional title and dot. Generic on purpose, never a copy of a real app's notification. */
.toast { background: #fff; color: var(--ink); border-radius: 22px; padding: .7em 1.1em; font-size: {{size}}px; font-weight: 600; line-height: 1.3; max-width: calc(var(--W) - 2 * var(--safe-side) - .1 * var(--W)); box-shadow: 0 14px 34px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.18); }
.toast .title { display: flex; align-items: center; gap: .45em; font-size: .78em; font-weight: 800; opacity: .75; margin-bottom: .25em; }
.toast .dot { width: .8em; height: .8em; border-radius: 50%; background: {{dot}}; }
.toast .text { white-space: pre-wrap; }
.toast.in.center-x { animation-name: plate-in-x; } .toast.out.center-x { animation-name: plate-out-x; }
@keyframes plate-in-x  { from { opacity: 0; transform: translate3d(-50%, calc(var(--ty) + 24px), 0) scale(.92); } to { opacity: 1; transform: translate3d(-50%, var(--ty), 0) scale(1); } }
@keyframes plate-out-x { from { opacity: 1; transform: translate3d(-50%, var(--ty), 0) scale(1); } to { opacity: 0; transform: translate3d(-50%, calc(var(--ty) - 12px), 0) scale(.96); } }
</style></head><body><div class="stage">
<div class="card toast in out center-x {{pos}}" style="{{style}}">{{title_html}}<div class="text">{{text}}</div></div>
</div><script>{{harness}}</script></body></html>
