<!doctype html><html><head><meta charset="utf-8"><style>{{theme}}
.cap { position: absolute; left: var(--safe-side); right: var(--safe-side); bottom: calc(var(--safe-bottom) + .02 * var(--H)); height: 0; text-align: center; }
.page { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0; font-size: {{size}}px; font-weight: 800; line-height: 1.22; letter-spacing: -0.01em; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.6), 0 0 14px rgba(0,0,0,.45); -webkit-text-stroke: 0px; }
.page { animation: page-on var(--len) step-end both; animation-fill-mode: none; }
@keyframes page-on { from { opacity: 1; } to { opacity: 1; } }
.page .inner { display: inline-block; animation: page-pop .22s var(--spring) both; animation-fill-mode: none; }
@keyframes page-pop { from { transform: scale(.97); opacity: .7; } to { transform: scale(1); opacity: 1; } }
.w { display: inline-block; padding: 0 .14em; border-radius: .24em; margin: 0 .02em; transition: none; }
.w.on { animation: w-on var(--wlen) step-end both; animation-fill-mode: none; }
/* pill: the spoken word sits in an accent pill. highlight: the spoken word turns accent. clean: no per-word change. */
@keyframes w-on { from { background: var(--accent); color: #fff; transform: scale(1.03); text-shadow: none; } to { background: var(--accent); color: #fff; transform: scale(1.03); text-shadow: none; } }
.style-highlight .w.on { animation-name: w-color; }
@keyframes w-color { from { color: var(--accent); transform: scale(1.03); } to { color: var(--accent); transform: scale(1.03); } }
.style-clean .w.on { animation: none; }
.w.key { color: var(--accent); }
.w.key.neg { color: #ff5c5c; } .w.key.pos { color: #3ddc84; }
.style-pill .w.key { color: #fff; }
.style-pill .w.on.neg { animation-name: w-on-neg; } .style-pill .w.on.pos { animation-name: w-on-pos; }
@keyframes w-on-neg { from { background: #d12d3a; color: #fff; transform: scale(1.03); text-shadow: none; } to { background: #d12d3a; color: #fff; transform: scale(1.03); text-shadow: none; } }
@keyframes w-on-pos { from { background: #1f9d5a; color: #fff; transform: scale(1.03); text-shadow: none; } to { background: #1f9d5a; color: #fff; transform: scale(1.03); text-shadow: none; } }
.style-box .w.key.neg { background: #d12d3a; } .style-box .w.key.pos { background: #1f9d5a; }
/* box: ALL CAPS, one line of 3-4 words, the key word sits in a solid accent box with a small radius (reference: creator ads, Nov 2026). */
.style-box { text-transform: uppercase; }
.style-box .page { font-family: var(--caption-font); font-size: calc({{size}}px * 1.08); letter-spacing: .01em; text-shadow: 0 2px 0 rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.5); -webkit-text-stroke: 1.5px rgba(0,0,0,.9); paint-order: stroke fill; }
.style-box .w.on { animation: none; }
.style-box .w.key { color: #fff; background: var(--accent); border-radius: .12em; padding: 0 .18em; -webkit-text-stroke: 0; text-shadow: none; }
.uc { text-transform: uppercase; }
</style></head><body><div class="stage"><div class="cap style-{{style}} {{uc}}">
{{pages_html}}
</div></div><script>{{harness}}</script></body></html>
